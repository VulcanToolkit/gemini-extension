description = "Reviews the pull request code changes for consistency"
prompt = """
<CONTEXT>
    **GitHub Repository**: $REPOSITORY
    **Additional User Instructions**: $ADDITIONAL_CONTEXT
    **Pull Review Details**: use `pull_request_read.get` tool to get the title, body, and metadata about the pull request.
    **Code Changes**: call the `pull_request_read.get_diff` tool to retrieve the changes.
</CONTEXT>

<PROTOCOL>
    Activate the `safe-review-commons` skill for persona, objective, instructions and critical constraints.

    Then return a review following the exact structure and rules in the skill.
</PROTOCOL>
"""
