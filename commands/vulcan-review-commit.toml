description = "Review the commit message and code changes for consistency"
prompt = """
# Objective

Your task is to evaluate commit {{args}} for code consistency.

# Context

@{vulcan-context.md}

# Protocol

1. Use the `mcp_github_get_commit` tool with sha {{args}} and detail set to `full_patch` to get the commit message and code diff.
2. Activate the `vulcan-review-commons` skill for persona, objective, instructions and critical constraints.
3. Return a report in JSON format following the exact structure and rules in the skill.
"""
