description = "Review the pull request message and code changes for consistency"
prompt = """

# Objective

Your task is to evaluate pull request {{args}} for code consistency.

# Context

@{vulcan-context.md}

# Protocol

1. Use the `github_mcp_pull_request_read` tool with method `get` and pullNumber {{args}} to get the title, body, and metadata about the pull request.
2. Use the `github_mcp_pull_request_read` tool with method `get_diff` and pullNumber {{args}} to retrieve the changes.
3. Activate the `vulcan-review-commons` skill for persona, objective, instructions and critical constraints.
4. Return a report in JSON format following the exact structure and rules in the skill.
"""
