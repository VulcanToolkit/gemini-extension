description = "Reviews the commit code changes for consistency"
prompt = """
<CONTEXT>
    **GitHub Repository**: ${REPOSITORY}
    **Additional User Instructions**: ${ADDITIONAL_CONTEXT}
    **Commit Message**: ${COMMIT_MESSAGE}
    **Commit SHA**: ${COMMIT_SHA}
